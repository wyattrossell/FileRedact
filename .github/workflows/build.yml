name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') { $v = $ref.Substring('refs/tags/v'.Length) } else { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Version: $v"

      - name: Restore
        run: dotnet restore FileRedact.sln

      - name: Build
        run: dotnet build FileRedact.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test FileRedact.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (win-x64, self-contained)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/FileRedact.App/FileRedact.App.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }} -p:PublishReadyToRun=false -o publish/FileRedact

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item README.md, tools -Destination publish/FileRedact -Recurse -Force
          Compress-Archive -Path publish/FileRedact/* -DestinationPath publish/FileRedact-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FileRedact ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: publish/FileRedact-win-x64.zip
